<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <!-- Dark luxury badge for crisp visibility -->
  <rect width="64" height="64" rx="16" fill="#1c1c19" />

  <!-- Sharp mountain peak forming letter 'A' of ALPS -->
  <g transform="translate(8, 6) scale(1)">
    <!-- Triangular sharp peak -->
    <path
      d="M24 5L43 41H5L24 5Z"
      stroke="#fed8c9"
      stroke-width="3.5"
      stroke-linecap="round"
      stroke-linejoin="round"
      fill="none"
    />
    <!-- Snowline crossbar -->
    <path
      d="M14 27L24 22L34 27"
      stroke="#fed8c9"
      stroke-width="3"
      stroke-linecap="round"
      stroke-linejoin="round"
      fill="none"
    />
    <!-- Vertical summit ridge -->
    <path
      d="M24 5V22"
      stroke="#fed8c9"
      stroke-width="2.5"
      stroke-linecap="round"
    />
  </g>

  <!-- ALPS wordmark below -->
  <text x="32" y="56" font-family="'Noto Serif', serif, Georgia" font-size="8.5" font-weight="500" fill="#fed8c9" letter-spacing="2.5" text-anchor="middle">ALPS</text>
</svg>
